# The HOLDOUT LOCK below is binding NOW regardless of the proposed status.
schema_version: 2
frozen_utc: "2026-08-12"
status: approved_pending_X0_freeze

splits:
  discovery:
    start: "2022-01-01"
    end: "2024-12-31"
