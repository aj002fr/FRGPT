e05_hypothesis_supported: false
e05_note: >
  After removing forward-path leakage, no strict success. Start-time
  dv01/contracts-per-tick AUC~0.51; soft lead flow_since_last_extreme is
  unstable. Hypothesis not supported at event-start on this sample.
e06_hypothesis_supported: false
e06_note: >
  Primary still-extending landmark (t+5m) sample: decay hypothesis NOT
  supported (regime direction wrong / underpowered; ablation ΔAUC negative).
  Level impact_efficiency_5m remains an in-sample lead (lower efficiency →
  higher exhaustion) but is not the decay claim. Holdout locked.
e07_hypothesis_supported: false
e07_provisional_lead: true
e07_note: >
  Boosted expected-impact best by OOS RMSE. Start-time shortfall is nearly
  collinear with -actual progress (r~-0.92); only +1.8pp AUC vs actual.
  Provisional vs residual/fixed on eval (n_resolved=64); cum shortfall
  excluded as path-contaminated. Holdout locked.
e08_hypothesis_supported: false
e08_note: >
  No strict successes. Soft leads: max_same_side_run, intensity_acceleration,
  sign_entropy (entropy direction opposite mixing→exhaustion). Only
  intensity_peak_passed clears 8pp flag spread. Persistence bundle AUC 0.55
  vs intensity 0.51. Hawkes unavailable on 1m panel. Holdout locked.
e09_hypothesis_supported: false
e09_note: >
  No continuous successes. Eval large_led n_resolved=3 so hypothesis contrast
  underpowered. Descriptive: large_flow_disappearance exhaustion ~69% vs
  opposite_large ~37% on eval. Holdout locked.
e10_hypothesis_supported: false
e10_opposite_stable_lead: true
e10_note: >
  Absorption→exhaustion NOT supported. Stable opposite: more directional
  DV01 at extreme without advance associates with CONTINUATION (score
  spearman -0.38, coef negative, survives controls ΔAUC~+1.8pp). Carry as
  falsified-direction candidate. Holdout locked.
e11_hypothesis_supported: true
e11_note: >
  Liquidity interactions supported in-sample and on eval (bundle ΔAUC
  +1.3pp / +5.3pp eval, n_resolved_eval=64). Useful: shortfall×depth,
  decay×depth (landmark subset), flowtick×spread. Wide-spread exhaustion
  ~66% vs tight ~55%. Boosted AUCs diagnostic-only (overfit). Holdout locked.
e12_hypothesis_supported: true
e12_note: >
  Microprice/imbalance confirmation supported: ΔAUC +10.4pp vs price-only.
  All continuous features succeed with hypothesized direction (supportive
  book → less exhaustion). Pattern flags ~+7pp (just under 8pp cut).
  Note: microprice_dev and size_imbalance are collinear (r=1) on this panel.
  Holdout locked.
