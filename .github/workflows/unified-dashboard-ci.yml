name: Unified Dashboard CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  l1-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: L1 sample validation
        run: python scripts/validate_l1_sample.py --l1-root tests/fixtures/l1_event_features --strict
      - name: Tab HTML smoke tests
        run: python -m pytest tests/unified_dashboard/test_tab_html_smoke.py -v

